services:
  - type: web
    name: quiz-app-backend
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python start.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.2
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 10000
      - key: RELOAD
        value: false
      - key: SECRET_KEY
        value: your-production-secret-key-change-this
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 30
